experiment_name: "mm2hs_transfer_random_q20"

model:
  name: "zhihan1996/DNABERT-2-117M"
  num_labels: 2
  attn_implementation: "flash_attention_2"
  torch_dtype: "float32"
  max_length: 128

data:
  dataset_name: "promoter"
  target_species: "hs"
  data_dir: "."
  seed: 42

pretrain:
  enabled: true
  source_species: "mm"
  num_epochs: 10
  learning_rate: 2e-5
  batch_size: 16

trainer:
  learning_rate: 2e-5
  weight_decay: 0.01
  batch_size: 16
  eval_batch_size: 32
  num_epochs: 5
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  device: "cuda"

active_learning:
  n_init: 100
  n_query: 20
  n_rounds: 100
  strategy: "random"
  freeze_backbone: false

wandb:
  enabled: true
  project: "bert-active-dna"
  entity: "codycjy"
  tags: ["promoter", "transfer", "mm2hs", "random", "full-finetune", "q20"]
  notes: "mm->hs full fine-tune + random, small batch q=20 r=100"

output_dir: "outputs"
