experiment_name: "covid_entropy"

model:
  name: "zhihan1996/DNABERT-2-117M"
  num_labels: 9
  attn_implementation: "flash_attention_2"
  torch_dtype: "float32"
  max_length: 128

data:
  dataset_name: "gue_virus_covid"
  seed: 42

pretrain:
  enabled: false

trainer:
  learning_rate: 2e-5
  weight_decay: 0.01
  batch_size: 16
  eval_batch_size: 32
  num_epochs: 5
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  device: "cuda"

active_learning:
  n_init: 100
  n_query: 100
  n_rounds: 20
  strategy: "entropy"

wandb:
  enabled: true
  project: "bert-active-dna"
  entity: "codycjy"
  tags: ["covid", "baseline", "entropy", "9class"]
  notes: "Baseline: Virus COVID 9-class entropy"

output_dir: "outputs"
