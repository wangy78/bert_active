experiment_name: "agnews_entropy"

model:
  name: "distilbert-base-uncased"
  num_labels: 4
  attn_implementation: "flash_attention_2"
  torch_dtype: "bfloat16"
  max_length: 128

data:
  dataset_name: "ag_news"
  seed: 42

trainer:
  learning_rate: 2e-5
  weight_decay: 0.01
  batch_size: 32
  eval_batch_size: 64
  num_epochs: 3
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  device: "cuda"

active_learning:
  n_init: 100
  n_query: 100
  n_rounds: 20
  strategy: "entropy"
  strategy_params: {}

output_dir: "outputs"
